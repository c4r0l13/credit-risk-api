[project]
name = "credit-risk-api"
version = "1.0.0"
description = "Production-style serving for a credit-risk PD model: FastAPI, Docker, drift monitoring, quality gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
